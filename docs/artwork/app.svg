<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">

<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f5"/>
  </linearGradient>
  <radialGradient id="well" cx="0.5" cy="0.42" r="0.6">
    <stop offset="0" stop-color="#e9eef2"/><stop offset="1" stop-color="#cfd8df"/>
  </radialGradient>
  <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e9ee"/>
  </linearGradient>
  <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8ed"/>
  </radialGradient>
  <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
    <rect width="80" height="80" fill="#eef3f6"/>
    <path d="M0 0.75H80M0.75 0V80" stroke="#dbe4ea" stroke-width="1.5"/>
  </pattern>
  <pattern id="floor" width="120" height="60" patternUnits="userSpaceOnUse">
    <rect width="120" height="60" fill="#c9d4db"/>
    <path d="M0 0.75H120M0.75 0V60" stroke="#b9c6ce" stroke-width="1.5"/>
  </pattern>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dff0f8"/><stop offset="0.55" stop-color="#c7e2ef"/><stop offset="1" stop-color="#b3d6e6"/>
  </linearGradient>
</defs>
<rect width="1000" height="700" fill="url(#tiles)"/>
<rect width="1000" height="700" fill="url(#light)" opacity="0.6"/>
<!-- floor -->
<rect y="600" width="1000" height="100" fill="url(#floor)"/>
<rect y="598" width="1000" height="6" fill="#aebcc5"/>
<!-- mirror with steam -->
<rect x="150" y="120" width="270" height="320" rx="26" fill="#9fb3bf"/>
<rect x="160" y="130" width="250" height="300" rx="20" fill="url(#mirror)"/>
<path d="M190 170 L270 140 M200 220 L330 155" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
<g fill="#ffffff" opacity="0.55" filter="url(#soft)">
  <ellipse cx="250" cy="370" rx="80" ry="38"/><ellipse cx="330" cy="340" rx="70" ry="34"/><ellipse cx="290" cy="300" rx="60" ry="28"/>
</g>
<!-- basin -->
<rect x="130" y="500" width="310" height="34" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="2"/>
<path d="M150 534 H420 L400 590 H170 Z" fill="#f4f7f9" stroke="#d3dce2" stroke-width="2"/>
<rect x="279" y="474" width="12" height="28" rx="5" fill="#b7c3cb"/>
<rect x="279" y="470" width="40" height="11" rx="5.5" fill="#b7c3cb"/>
<!-- towel rail with towel -->
<rect x="560" y="470" width="220" height="10" rx="5" fill="#b7c3cb"/>
<rect x="566" y="458" width="10" height="22" rx="4" fill="#a5b3bc"/>
<rect x="764" y="458" width="10" height="22" rx="4" fill="#a5b3bc"/>
<rect x="590" y="476" width="150" height="110" rx="10" fill="#00A0E3"/>
<rect x="590" y="560" width="150" height="10" fill="#0089c2"/>
<rect x="590" y="476" width="150" height="16" rx="6" fill="#33b3e9"/>
<!-- plant -->
<rect x="840" y="528" width="70" height="72" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="2"/>
<g fill="#5fae8a"><ellipse cx="860" cy="500" rx="16" ry="38" transform="rotate(-18 860 500)"/>
<ellipse cx="890" cy="492" rx="15" ry="42" transform="rotate(14 890 492)"/><ellipse cx="875" cy="486" rx="12" ry="46"/></g>
<!-- air being pulled towards the fan -->
<path d="M430 330 C 520 320, 590 225, 672 205"
    fill="none" stroke="#00A0E3" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="0" opacity="0.6"/><path d="M436 364 C 520 354, 590 251, 672 231"
    fill="none" stroke="#00A0E3" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="2 16" opacity="0.44999999999999996"/><path d="M442 398 C 520 388, 590 277, 672 257"
    fill="none" stroke="#00A0E3" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="2 16" opacity="0.3"/>
<!-- the fan, high on the wall -->

  <g transform="translate(695 135) scale(1.9)">
    <rect x="3" y="6" width="100" height="100" rx="16" fill="#0b2a3a" opacity="0.13" filter="url(#blur)"/>
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#panel)"/>
    <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="15.4" fill="none" stroke="#d4dde3" stroke-width="1.2"/>
    <rect x="6" y="6" width="88" height="88" rx="11" fill="none" stroke="#e7edf1" stroke-width="1"/>
    <circle cx="50" cy="50" r="40.5" fill="url(#well)"/>
    <circle cx="50" cy="50" r="40.5" fill="none" stroke="#c9d3da" stroke-width="1"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="url(#slat)" stroke-width="3.2"/><circle cx="50" cy="50" r="30.5" fill="none" stroke="url(#slat)" stroke-width="3.2"/><circle cx="50" cy="50" r="25" fill="none" stroke="url(#slat)" stroke-width="3.2"/><circle cx="50" cy="50" r="19.5" fill="none" stroke="url(#slat)" stroke-width="3.2"/><circle cx="50" cy="50" r="14" fill="none" stroke="url(#slat)" stroke-width="3.2"/>
    <circle cx="50" cy="50" r="8.5" fill="url(#hub)" stroke="#c3cdd4" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="3" fill="#dfe6eb"/>
    <circle cx="86" cy="88" r="1.9" fill="#2fb3e8"/>
  </g>
</svg>