name: Validate Homey App
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:  
    main:
      name: Validate Homey App
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: athombv/github-action-homey-app-validate@master
          with:
            level: verified
