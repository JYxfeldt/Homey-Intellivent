name: Validate Homey App
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:  
    main:
      name: Validate Homey App
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # master
          with:
            level: verified
